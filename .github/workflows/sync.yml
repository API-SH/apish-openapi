name: Sync specs

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the catalog and every spec
        run: node scripts/sync.mjs
      - name: Commit changes
        run: |
          git add -A specs index.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          changed=$(git diff --cached --name-only -- specs | wc -l | tr -d ' ')
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync specs: ${changed} file(s) changed"
          git push
